[general]
library_name = "libghostty_vt"
output_file_path = "../src/LibGhosttyVT.jl"
module_name = "LibGhosttyVT"
jll_pkg_name = "libghostty_vt_jll"
export_symbol_prefixes = ["Ghostty", "ghostty_", "GHOSTTY_"]
output_ignorelist = ["GHOSTTY_API", "GHOSTTY_DEPRECATED", "GHOSTTY_ENUM_TYPED", "GHOSTTY_INIT_SIZED"]
print_using_CEnum = true
use_deterministic_symbol = true
is_local_header_only = true
skip_static_functions = true
prologue_file_path = "./prologue.jl"
extract_c_comment_style = "doxygen"
struct_field_comment_style = "outofline"
enumerator_comment_style = "outofline"

[codegen]
use_julia_bool = true
always_NUL_terminated_string = true
use_ccall_macro = true

[codegen.macro]
macro_mode = "basic"
